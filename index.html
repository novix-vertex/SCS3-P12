<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Games</title>
    <link rel="shortcut icon" href="assets/images/fighter.webp" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <img class="logo" src="assets/images/logo.png" alt="logo">
            <nav>
                <ul>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Watch now</a></li>
                    <li><a href="#">Actors</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            <div class="link">
                <i class="ri-menu-3-line"></i>
            </div>
        </header>
        <section class="hero">
            <div class="left">
                <img src="assets/images/logo.png" alt="">
                <p>Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br />
                    Season 1:9 Episodes</p>
            </div>
            <div class="links">
                <button class="play-now"><i class="ri-play-fill"></i>Play Now</button>
                <button class="watch-trailer"><i class="ri-play-line"></i>Watch Trailer</button>
            </div>
            <div class="right">
                <div class="scroll">
                    <h4>scroll</h4>
                    <hr>
                </div>
                <img src="assets/images/fighter.webp" alt="fighter">
                <div class="socials">
                    <img src="assets/images/twitter.png" alt="twitter">
                    <img src="assets/images/insta.png" alt="insta">
                    <img src="assets/images/facebook.png" alt="facebook">
                </div>
            </div>
        </section>
        <section class="thumbnails">
            <div class="" thumbnail thumbnail1>
                <img class="thumb thumb1" src="assets/images/tile_1.jpg" alt="thumbnails">
                <i class="ri-play-fill"></i>
            </div>

            <div class="" thumbnail thumbnail2>
                <img class="thumb thumb2" src="assets/images/tile_2.jpg" alt="thumbnails">
                <i class="ri-play-fill"></i>
            </div>

            <div class="" thumbnail thumbnail3>
                <img class="thumb thumb3" src="assets/images/tile_3.jpg" alt="thumbnails">
                <i class="ri-play-fill"></i>
            </div>

        </section>
    </main>
</body>

</html>
